{% for field in form %}<div class="form-field">{{ field.label_tag }}{{ field }}{% if field.help_text %}<p class="form-help">{{ field.help_text|safe }}</p>{% endif %}{% for error in field.errors %}<p class="errorlist">{{ error }}</p>{% endfor %}</div>{% endfor %}{% for error in form.non_field_errors %}<p class="errorlist">{{ error }}</p>{% endfor %}
